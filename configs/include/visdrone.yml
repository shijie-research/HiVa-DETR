# VisDrone2019-DET validation split, resized to 800 x 800

num_classes: 12   # the official category ids 0..11; 1..10 are scored

DFINETransformer:
  num_queries: 500
  anchor_cells: 5

val_dataloader:
  type: DataLoader
  dataset:
    type: VisDroneDetection
    split: validation
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [800, 800]}
        - {type: ConvertPILImage, dtype: float32, scale: True}
  collate_fn:
    type: BatchImageCollateFunction
    pad_to_multiple: 32
  shuffle: False
  num_workers: 4
  total_batch_size: 16

evaluator:
  type: VisDroneEvaluator
  iou_types: [bbox]
  ignore_iof_threshold: 0.5
